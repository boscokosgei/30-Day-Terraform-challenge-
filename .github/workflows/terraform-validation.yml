name: Terraform Validation

on:
  pull_request:
    branches:
      - 'week*'
    types: [opened, synchronize, reopened]

jobs:
  terraform-validation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Debug Directory Listing
        run: |
          echo "🔍 Listing files in the repository:"
          find . -type f

      - name: Check Terraform File Structure
        id: structure
        run: |
          echo "Checking for Terraform files in expected format..."
          tf_files=$(find . -name "*.tf" | grep -E "./Day[0-9]+/Submissions/[^/]+/.+\.tf" || true)
          if [[ -z "$tf_files" ]]; then
            echo "❌ No valid Terraform files found in expected folder structure!"
            echo "Expected format: Day<number>/Submissions/<username>/*.tf"
            exit 1
          fi
          echo "$tf_files"
          echo "✅ Terraform files found and structure looks good."

      - name: Terraform Format Check
        run: |
          echo "Running terraform fmt..."
          terraform fmt -check -recursive

      - name: Terraform Init and Validate
        run: |
          echo "Running terraform init and validate..."
          for dir in $(find . -name "*.tf" -exec dirname {} \; | sort -u); do
            echo "▶️ Directory: $dir"
            cd $dir
            terraform init -backend=false
            terraform validate -no-color
            cd - > /dev/null
          done
